<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDQP Quiz - Thử thách Biển Đảo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="start-screen" class="screen active">
            <h1>THỬ THÁCH BIỂN ĐẢO</h1>
            <p>Bạn đã sẵn sàng kiểm tra kiến thức GDQP của mình chưa?</p>
            <button id="start-btn" class="btn">Bắt đầu!</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div id="quiz-header">
                <span id="question-counter">Câu 1/6</span>
                <span id="score-display">Điểm: 0</span>
            </div>
            <h2 id="question">Đây là nơi câu hỏi xuất hiện...</h2>
            <div id="options-container">
                </div>
            <p id="feedback"></p>
            <button id="next-btn" class="btn btn-next hide">Câu tiếp theo</button>
        </div>

        <div id="end-screen" class="screen">
            <h2>HOÀN THÀNH!</h2>
            <h3 id="final-score">Bạn đạt: 0/6</h3>
            <button id="restart-btn" class="btn">Chơi lại</button>
            <a href="LINK_CANVA_CUA_BAN_TAI_DAY" class="btn btn-canva">
                Quay lại Bài thuyết trình
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
